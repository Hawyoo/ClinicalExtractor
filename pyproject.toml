[project]
name = "clinical-extractor"
version = "1.0.0"
description = "Local clinical report extractor using PP-StructureV3 + LangExtract + Ollama"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "beautifulsoup4>=4.12",
  "requests>=2.32",
  "langextract>=1.0.0",
]

[project.optional-dependencies]
ocr = ["paddleocr[doc-parser]>=3.4,<4"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
clinical-extractor = "clinical_extractor.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clinical_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
