id: all
name: 表格式报告
version: 2
coverage: partial
reference_policy: 参考范围仅辅助项目匹配；保留报告原范围，不作为通用正常阈值
missing_policy: 只匹配当前图片实际出现的指标，不补项目或结果；存在多个候选时保留核对提示
# 以下分组仅方便维护和查找，表示常见检查类别；不限制自动匹配范围。
items:

