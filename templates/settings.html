{% extends "base.html" %}{% block content %}<section class="card"><h2>运行设置</h2><form action="/settings" method="post" class="grid"><label>Ollama 地址<input name="ollama_url" value="{{settings.ollama_url}}"></label><label>Ollama 模型<input name="ollama_model" value="{{settings.ollama_model}}"></label><label>PP-Structure设备<input name="pp_device" value="{{settings.pp_device}}" placeholder="cpu / gpu"></label><label>单块最大文本字符<input type="number" name="max_text_chars" value="{{settings.max_text_chars}}"></label><label>测试模式<select name="mock_mode"><option value="0" {% if not settings.mock_mode %}selected{% endif %}>关闭</option><option value="1" {% if settings.mock_mode %}selected{% endif %}>开启（不调用模型）</option></select></label><button>保存</button></form><p class="muted">推荐先在 Ollama 中准备一个中文能力较好的模型，例如 qwen3:8b；模型名称可在这里修改。</p></section>{% endblock %}
