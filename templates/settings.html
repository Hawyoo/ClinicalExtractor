{% extends "base.html" %}{% block content %}<section class="card"><h2>运行设置</h2><form action="/settings" method="post" class="grid"><label>Ollama 地址<input name="ollama_url" value="{{settings.ollama_url}}"></label><label>Ollama 模型<input name="ollama_model" value="{{settings.ollama_model}}"></label><label>OCR 设备<input name="pp_device" value="{{settings.pp_device}}" placeholder="cpu / gpu"></label><label>OCR 线程数<input type="number" name="ocr_cpu_threads" min="0" max="256" value="{{settings.ocr_cpu_threads}}"></label><label>单块最大文本字符<input type="number" name="max_text_chars" value="{{settings.max_text_chars}}"></label><button>保存</button></form><p class="muted">表格式报告使用 PP-OCRv5，先按坐标恢复行列，必要时由 SLANet_plus 回退，再校验模板；长文本报告仅运行 PP-OCRv5，再交给 Ollama。推荐先在 Ollama 中准备中文模型，例如 qwen3:8b。</p><p class="muted">OCR 线程数：0 为自动（{{auto_ocr_threads}} 线程）；一次处理一份报告，下份任务生效。</p></section>{% endblock %}
