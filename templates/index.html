{% extends "base.html" %}{% block content %}
<section class="card"><h2>导入报告</h2><form action="/upload" method="post" enctype="multipart/form-data" class="grid"><label>患者ID<input name="patient_id"></label><label>报告日期<input name="report_date" type="date"></label><label>报告类型<input name="report_type" placeholder="如：生化/病理/MRI"></label><label>抽取配置<select name="profile">{% for p in profiles %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select></label><label class="wide">PDF/JPG/PNG<input type="file" name="files" multiple required></label><button>导入</button></form></section>
<section class="toolbar"><form action="/process-pending" method="post"><button>处理全部未处理报告</button></form><a class="button secondary" href="/export/csv">导出CSV</a><a class="button secondary" href="/export/xlsx?reviewed_only=1">仅导出已审核</a></section>
<section class="card"><h2>报告列表</h2><table><thead><tr><th>ID</th><th>患者</th><th>日期</th><th>类型</th><th>文件</th><th>状态</th><th>结果数</th><th></th></tr></thead><tbody>{% for r in reports %}<tr><td>{{r.id}}</td><td>{{r.patient_id}}</td><td>{{r.report_date}}</td><td>{{r.report_type}}</td><td>{{r.filename}}</td><td><span class="status">{{r.status}}</span></td><td>{{r.n}}</td><td><a href="/report/{{r.id}}">查看</a></td></tr>{% else %}<tr><td colspan="8">尚无报告</td></tr>{% endfor %}</tbody></table></section>
{% endblock %}
