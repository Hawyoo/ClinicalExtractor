<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>已退出 · ClinicalExtractor</title>
  <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,{{favicon}}">
  <style>
    :root{font-family:"Microsoft YaHei",sans-serif;color-scheme:light;color:#1f2937;background:#f4f6f8}
    :root[data-theme="dark"]{color-scheme:dark;color:#e7eee9;background:#111713}
    main{max-width:480px;margin:15vh auto;padding:28px}
    img{width:64px;height:64px}p{line-height:1.8}button{padding:10px 18px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer}
  </style>
</head>
<body><main>
  <img src="data:image/x-icon;base64,{{favicon}}" alt="ClinicalExtractor">
  <h1>程序已退出</h1>
  <p id="status">正在尝试自动关闭此页面…</p>
  <button type="button" id="close-page">关闭此页面</button>
</main>
<script>
try { document.documentElement.dataset.theme={{ui_preferences.theme|tojson}}||localStorage.getItem('theme-preference')||'light'; } catch (_) {}
function closePage(){
  try { window.open('', '_self'); window.close(); } catch (_) {}
  setTimeout(()=>{document.getElementById('status').textContent='浏览器限制了自动关闭。程序已退出，请手动关闭此标签页。';},400);
}
document.getElementById('close-page').addEventListener('click',closePage);
setTimeout(closePage,800);
</script></body></html>
