<!doctype html><html lang="zh-CN" data-theme="{{ui_preferences.theme or 'light'}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ClinicalExtractor{% endblock %}</title><link rel="icon" href="/static/clinical-extractor.ico" sizes="any"><script>window.clinicalPreferences={{ui_preferences|tojson}};try{if(!window.clinicalPreferences.theme){const previous=localStorage.getItem('theme-preference');if(['dark','light'].includes(previous))document.documentElement.dataset.theme=previous;}}catch(_){}</script><script src="/static/preferences.js?v=20261105-portable" defer></script><link rel="stylesheet" href="/static/style.css?v=20261106-template-sections"></head><body><header><div><b>ClinicalExtractor</b><span>本地临床报告结构化提取</span></div><nav>{% include "project_tools.html" %}<button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换夜间模式" title="切换夜间模式">🌙</button><a href="/">报告</a><a href="/settings">设置</a>{% if not project_management_enabled or current_project %}<a href="/export/csv">导出</a>{% include "transfer_tools.html" %}{% endif %}<form action="/quit" method="post" class="quit-form" onsubmit="return confirm('确定退出 ClinicalExtractor？未完成的处理会停止。')"><button class="quit-button" type="submit">退出程序</button></form></nav></header><main>{% block content %}{% endblock %}</main><script src="/static/shutdown.js?v=public-1" defer></script></body></html>
