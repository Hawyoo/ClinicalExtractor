<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ClinicalExtractor{% endblock %}</title><link rel="icon" href="/static/clinical-extractor.ico" sizes="any"><link rel="stylesheet" href="/static/style.css"></head><body><header><div><b>ClinicalExtractor</b><span>本地临床报告结构化提取</span></div><nav><button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换夜间模式" title="切换夜间模式">🌙</button><a href="/">报告</a><a href="/settings">设置</a><a href="/export/xlsx">导出Excel</a><form action="/quit" method="post" class="quit-form" onsubmit="return confirm('确定退出 ClinicalExtractor？未完成的处理会停止。')"><button class="quit-button" type="submit">退出程序</button></form></nav></header><main>{% block content %}{% endblock %}</main><script>function applyTheme(preference=localStorage.getItem('theme-preference')||'light'){const dark=preference==='dark';document.documentElement.dataset.theme=dark?'dark':'light';const button=document.getElementById('theme-toggle');button.textContent=dark?'☀️':'🌙';button.setAttribute('aria-pressed',String(dark));button.title=dark?'切换浅色模式':'切换夜间模式'}document.getElementById('theme-toggle').addEventListener('click',()=>{const preference=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('theme-preference',preference);applyTheme(preference)});applyTheme();</script></body></html>
